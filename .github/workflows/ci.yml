name: CLI checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff
      - run: ruff check src tests
      - run: python -m unittest discover -s tests -v
  rust:
    name: Mac CLI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --release --manifest-path vendor/wxemoticon/cli/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pyinstaller
      - run: ./scripts/build-engine.sh
      - run: python scripts/package-macos.py
      - name: Smoke test packaged CLI
        run: |
          dist/wechat-emoji/wechat-emoji --version
          dist/wechat-emoji/wechat-emoji --home "$RUNNER_TEMP/cli-state" --wechat-root "$RUNNER_TEMP/no-wechat" --json doctor
      - uses: actions/upload-artifact@v4
        with:
          name: macos-cli-${{ matrix.arch }}
          path: dist/wechat-emoji-macos-*.tar.gz
          retention-days: 7
