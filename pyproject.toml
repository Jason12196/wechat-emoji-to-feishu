[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-emoji-to-feishu"
version = "0.1.0"
description = "Local-first WeChat emoji export and Feishu import CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Jason12196"}]
dependencies = ["Pillow>=10", "pycryptodome>=3.19", "playwright>=1.40"]

[project.scripts]
wechat-emoji = "wechat_emoji_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wechat_emoji_cli.engines" = ["LICENSE.wechatemoji"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
